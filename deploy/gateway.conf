worker_processes auto;
pid /tmp/nginx.pid;
# nginx error messages can contain original request URLs. Never emit these to container logs.
error_log /dev/null;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe 'status=$status bytes=$body_bytes_sent duration=$request_time';
  access_log /dev/stdout safe;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Resolve container replacements again rather than holding stale startup IPs forever.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    set $gonic http://gonic:80;
    set $api http://api:3000;
    set $web_ui_enabled "${WEB_UI_ENABLED}";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_next_upstream off;
    add_header X-Content-Type-Options nosniff always;

    location = /health/live { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /health/ready { proxy_pass $api$request_uri; }
    location = /rest { default_type application/json; return 404 '{"error":"not_found"}'; }
    location ^~ /rest/ {
      proxy_pass $gonic$request_uri;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_intercept_errors off;
      proxy_redirect off;
    }
    location ~ ^/api(?:/|$) {
      proxy_pass $api$request_uri;
      proxy_intercept_errors off;
      error_page 502 504 = @api_unavailable;
    }
    location = /.well-known/musiclatte-server {
      proxy_pass $api$request_uri;
      proxy_intercept_errors off;
      error_page 502 504 = @api_unavailable;
    }
    location @api_unavailable { default_type application/json; return 502 '{"schemaVersion":1,"error":{"code":"upstream_unavailable","retryable":true}}'; }
    location ~ ^/(?:__gallery|__debug|@vite|@id|@fs|src|node_modules)(?:/|$) { return 404; }
    location ~ /\. { return 404; }
    location /assets/ { try_files $uri =404; }
    location / {
      if ($web_ui_enabled != "true") { return 404; }
      try_files $uri /index.html;
    }
  }
}
